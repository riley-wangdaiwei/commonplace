<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>commonplace</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.5;
    max-width: 96ch; margin: 0 auto; padding: 16px;
    color: #111; background: #fff;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; }
  .sub { color: #555; margin-bottom: 16px; }
  .bar { border-top: 1px solid #111; margin: 16px 0; }
  .sec-title { font-weight: bold; margin-bottom: 8px; }
  .sec-title::before { content: "== "; }
  .sec-title::after { content: " =="; }
  input[type=text], select, textarea {
    font: inherit; border: 1px solid #111; padding: 4px 6px;
    background: #fff; color: #111; width: 100%;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    font: inherit; border: 1px solid #111; background: #fff;
    padding: 3px 10px; cursor: pointer;
  }
  button:hover { background: #111; color: #fff; }
  button.danger:hover { background: #a00; border-color: #a00; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .row .fixed { flex: 0 0 auto; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .cat { border: 1px solid #111; padding: 2px 8px; cursor: pointer; user-select: none; }
  .cat.on { background: #111; color: #fff; }
  .node { border: 1px solid #111; margin-bottom: 8px; }
  .node-head { padding: 6px 8px; cursor: pointer; }
  .node-head:hover { background: #f2f2f2; }
  .node-head .t { font-weight: bold; }
  .node-head .t::before { content: "> "; }
  .node.open .node-head .t::before { content: "v "; }
  .meta { color: #555; font-size: 12px; }
  .tag { border: 1px solid #555; padding: 0 6px; font-size: 12px; color: #333; }
  .node-body { border-top: 1px dashed #999; padding: 8px; display: none; }
  .node.open .node-body { display: block; }
  .link { margin: 4px 0; padding-left: 12px; }
  .link::before { content: "-> "; }
  .why { color: #555; }
  .why::before { content: "("; }
  .why::after { content: ")"; }
  .small { font-size: 12px; color: #555; }
  #status { white-space: pre-wrap; }
  a { color: #111; }
  .topbar { margin: 12px 0 4px 0; }
  .tab { cursor: pointer; padding: 2px 10px; border: 1px solid #111; margin-right: 6px; user-select: none; }
  .tab.on { background: #111; color: #fff; }
</style>
<style>
  /* v1 additions: search-first layout + cite box + graph */
  body { max-width: 150ch; }
  .bigsearch input[type=text] { padding: 10px 12px; font-size: 16px; }
  .navlink { margin-left: 10px; }
  h1 a { text-decoration: none; }
  .result { border: 1px solid #111; margin-bottom: 8px; }
  .result-head { padding: 6px 8px; cursor: pointer; }
  .result-head:hover { background: #f2f2f2; }
  .snip { color: #555; font-size: 12px; padding: 0 8px 6px 8px; }
  .md-h { font-weight: bold; margin: 14px 0 4px 0; }
  .md ul { margin: 4px 0; padding-left: 20px; }
  .md p { margin: 6px 0; }
  .citebox { border: 1px solid #111; padding: 8px; margin: 8px 0; }
  .citebox pre { white-space: pre-wrap; font: inherit; font-size: 12px; background: #f6f6f6; padding: 8px; margin: 4px 0 8px 0; }
  .unresolved { color: #999; border-bottom: 1px dashed #999; }
  .inbox-item { border-top: 1px dashed #999; padding: 8px 0; }
  .inbox-item:first-of-type { border-top: none; }
  #graph-canvas { border: 1px solid #111; width: 100%; display: block; cursor: grab; }
  .pg-meta { color: #555; font-size: 12px; margin-bottom: 12px; }
  .pg-title { font-size: 18px; font-weight: bold; margin: 0 0 4px 0; }
</style>
</head>
<body>

<h1><a href="#/">commonplace</a></h1>
<div class="sub">a commonplace book -- questions, readings, ideas; capture now, link later, compile eventually</div>
<div class="topbar" id="nav">
  <span class="tab" data-go="#/todo">[to do]</span><span class="tab" data-go="#/graph">[graph]</span><span class="tab" data-go="#/pages">[pages]</span><span class="small navlink"><a href="#/inbox" id="inbox-link">[inbox]</a></span>
</div>

<div id="view"></div>

<div class="bar"></div>
<div class="small">nodes are yours. links are yours. the llm only suggests -- never writes links.</div>

<script src="vendor/d3-quadtree.min.js"></script>
<script src="vendor/d3-dispatch.min.js"></script>
<script src="vendor/d3-timer.min.js"></script>
<script src="vendor/d3-force.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
